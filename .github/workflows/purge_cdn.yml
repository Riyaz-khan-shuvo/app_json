name: Auto-Purge jsDelivr CDN

on:
  push:
    branches:
      - main
    paths:
      - '**/*.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  purge:
    name: Purge jsDelivr Cache
    runs-on: ubuntu-latest

    steps:
      - name: Purge prompts.json cache
        shell: bash
        run: |
          set -euo pipefail

          URL="https://purge.jsdelivr.net/gh/Riyaz-khan-shuvo/app_json@main/viral_ai_prompts/prompts.json"

          echo "Requesting jsDelivr cache purge..."

          RESPONSE=$(curl --fail-with-body -sS \
            --max-time 60 \
            "$URL")

          echo "Purge API response:"
          echo "$RESPONSE"
